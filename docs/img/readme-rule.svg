<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="ti de">
<title id="ti">A vibrating string</title>
<desc id="de">A string fixed at both ends, in the eight track colours along its length. It is drawn as its first eight standing waves, vibrating at whole-number multiples of the lowest, and how strongly each one sounds drifts slowly.</desc>
